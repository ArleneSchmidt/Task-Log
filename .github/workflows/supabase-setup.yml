name: Supabase setup
on:
  push:
    paths: ['.github/workflows/supabase-setup.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rotate database password
        env:
          SB: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          set -u
          NEWPW=$(openssl rand -hex 24)
          Q=$(jq -nc --arg p "$NEWPW" '{query:("alter role postgres with password " + ($p|@json|sub("^\"";"'"'"'")|sub("\"$";"'"'"'")) + ";")}')
          CODE=$(curl -sS -o /tmp/b -w '%{http_code}' -X POST -H "Authorization: Bearer $SB" -H "Content-Type: application/json" https://api.supabase.com/v1/projects/lsbapifsndemdowiehfe/database/query --data-binary "$Q")
          unset NEWPW Q
          if [ "${CODE:0:1}" = "2" ]; then R="Password rotated OK"; else R="Rotate failed HTTP $CODE: $(head -c 300 /tmp/b)"; fi
          git rm -q --ignore-unmatch setup-status.txt
          echo "$R" > rotate-status.txt
          git config user.name "quest-log-setup"; git config user.email "quest-log-setup@users.noreply.github.com"
          git add -A && git commit -qm "Rotate database password; remove old status file" && git push -q
