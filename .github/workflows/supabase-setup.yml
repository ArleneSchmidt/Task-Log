name: Supabase setup
on:
  push:
    paths: ['.github/workflows/supabase-setup.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: End-to-end account test
        env:
          SB: ${{ secrets.SUPABASE_TOKEN }}
        run: |
          set +e -u
          log(){ echo "$*" >> /tmp/status; }
          URL=$(jq -r .url supabase-public.json); ANON=$(jq -r .anon supabase-public.json); REF=${URL#https://}; REF=${REF%%.*}
          H=(-H "apikey: $ANON" -H "Content-Type: application/json")
          R=$RANDOM$RANDOM; EMAIL="ql.test.$R@questlogtest.dev"; USER="tester$R"; PW="pass$R"
          S=$(curl -s "${H[@]}" "$URL/auth/v1/signup" -d "$(jq -nc --arg e "$EMAIL" --arg p "$PW" --arg u "$USER" '{email:$e,password:$p,data:{username:$u}}')")
          TOK=$(echo "$S" | jq -r '.access_token // empty'); UIDX=$(echo "$S" | jq -r '.user.id // .id // empty')
          [ -n "$TOK" ] && log "signup: ok (instant sign-in)" || log "signup: $(echo "$S" | head -c 300)"
          log "username taken check: $(curl -s "${H[@]}" "$URL/rest/v1/rpc/username_available" -d "{\"u\":\"$USER\"}")  (expect false)"
          log "username free check: $(curl -s "${H[@]}" "$URL/rest/v1/rpc/username_available" -d '{"u":"nobody_here_123"}')  (expect true)"
          W=$(curl -s "${H[@]}" "$URL/rest/v1/rpc/email_for_login" -d "$(jq -nc --arg l "$USER" '{login:$l,pw:"wrongpass"}')")
          log "login lookup wrong password: $W (expect null)"
          G=$(curl -s "${H[@]}" "$URL/rest/v1/rpc/email_for_login" -d "$(jq -nc --arg l "${USER^^}" --arg p "$PW" '{login:$l,pw:$p}')")
          [ "$G" = "\"$EMAIL\"" ] && log "login lookup right password (any case): ok" || log "login lookup right password: unexpected $G"
          L=$(curl -s "${H[@]}" "$URL/auth/v1/token?grant_type=password" -d "$(jq -nc --arg e "$EMAIL" --arg p "$PW" '{email:$e,password:$p}')" | jq -r '.access_token // empty')
          [ -n "$L" ] && log "password sign-in: ok" || log "password sign-in: failed"
          P=$(curl -s "${H[@]}" -H "Authorization: Bearer $L" "$URL/rest/v1/profiles?select=username")
          log "own profile: $P"
          U=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "Authorization: Bearer $L" -H "Prefer: resolution=merge-duplicates" "$URL/rest/v1/user_data" -d "$(jq -nc --arg id "$UIDX" '{user_id:$id,data:{projects:[{id:"x",name:"Test"}]},updated_at:123}')")
          log "save tasks: HTTP $U (expect 201)"
          U2=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "Authorization: Bearer $L" -H "Prefer: resolution=merge-duplicates" "$URL/rest/v1/user_data" -d "$(jq -nc --arg id "$UIDX" '{user_id:$id,data:{projects:[]},updated_at:456}')")
          log "save again (upsert): HTTP $U2"
          log "read own tasks: $(curl -s "${H[@]}" -H "Authorization: Bearer $L" "$URL/rest/v1/user_data?select=updated_at")"
          log "anonymous read of tasks: $(curl -s "${H[@]}" "$URL/rest/v1/user_data?select=user_id") (expect [])"
          log "anonymous read of emails: $(curl -s "${H[@]}" "$URL/rest/v1/profiles?select=email") (expect [])"
          log "anonymous read of attempts: $(curl -s "${H[@]}" "$URL/rest/v1/login_attempts?select=*") (expect [] or error)"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H "Authorization: Bearer $L" "$URL/auth/v1/user" -X PUT -d '{"password":"newpass123"}')
          log "change password: HTTP $CODE (expect 200)"
          SR=$(curl -s -H "Authorization: Bearer $SB" "https://api.supabase.com/v1/projects/$REF/api-keys" | jq -r '[.[]|select(.name=="service_role")][0].api_key')
          DEL=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "apikey: $SR" -H "Authorization: Bearer $SR" "$URL/auth/v1/admin/users/$UIDX")
          unset SR
          log "test user cleaned up: HTTP $DEL"
          git rm -q --ignore-unmatch setup-status.txt rotate-status.txt
          cp /tmp/status test-status.txt
          git config user.name "quest-log-setup"; git config user.email "quest-log-setup@users.noreply.github.com"
          git add -A && git commit -qm "Account test results" && git push -q
