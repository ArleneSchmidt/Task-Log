<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quest Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6edf2; --surface:#ffffff; --surface-2:#f0f4f8; --ink:#1c2836; --muted:#647487;
  --line:#dbe3ea; --facet:#3c5a78; --gold:#f2a900; --gold-ink:#3a2a00; --focus:#3d7bf0;
  --red:#d9443b; --orange:#e07a26; --wait:#7b61d6;
  --shadow:0 12px 36px rgba(20,32,48,.18);
  --cut:10px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a24; --surface:#1b2531; --surface-2:#232f3d; --ink:#e4ebf2; --muted:#8b9bae;
    --line:#2e3b4b; --facet:#7fa7d1; --gold:#ffc23d; --gold-ink:#2b1f00; --focus:#7aa8ff;
    --red:#ff6f66; --orange:#ff9a4d; --wait:#a993ff;
    --shadow:0 12px 36px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a24; --surface:#1b2531; --surface-2:#232f3d; --ink:#e4ebf2; --muted:#8b9bae;
  --line:#2e3b4b; --facet:#7fa7d1; --gold:#ffc23d; --gold-ink:#2b1f00; --focus:#7aa8ff;
  --red:#ff6f66; --orange:#ff9a4d; --wait:#a993ff;
  --shadow:0 12px 36px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Chakra Petch",ui-rounded,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
#facets{position:fixed;inset:0;z-index:0;pointer-events:none}
#facets svg{width:100%;height:100%}
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:16px 20px 60px}
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--focus)}
[hidden]{display:none!important}
.field{background:var(--surface-2);border:0;padding:10px 12px;min-width:0}
.field::placeholder,textarea::placeholder{color:var(--muted)}
select.field{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.go{background:var(--ink);color:var(--bg);padding:10px 16px;font-weight:600;flex:none}
.go:hover{background:var(--pc,var(--ink));color:#fff}
.ghost{background:var(--surface-2);padding:10px 16px;font-weight:600}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;background:var(--surface);font-size:16px;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.gem{width:24px;height:24px;flex:none}

/* header */
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;margin-right:auto;white-space:nowrap}
.brand svg{width:30px;height:30px}
.searchbtn{flex:none;display:flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 14px;background:var(--surface);color:var(--muted);font-size:14px;min-width:230px}
.searchbtn:hover{color:var(--ink)}
.searchbtn kbd{margin-left:auto;font-family:inherit;font-size:12px;padding:1px 7px;background:var(--surface-2);color:var(--muted)}
.xp{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:var(--surface)}
.lvl{white-space:nowrap;font-weight:700;font-size:13px;background:var(--gold);color:var(--gold-ink);padding:2px 9px;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.xpbar{display:flex;gap:2px}
.xpbar i{width:8px;height:12px;background:var(--line);clip-path:polygon(30% 0,100% 0,70% 100%,0 100%);transition:background .3s}
.xpbar i.on{background:var(--gold)}
.userbtn{height:38px;padding:0 14px 0 8px;display:flex;align-items:center;gap:9px;background:var(--surface);font-weight:600;font-size:14px;flex:none}
.userbtn:hover{background:var(--surface-2)}
.userbtn.out{padding:0 16px;background:var(--ink);color:var(--bg)}
.userbtn .av{width:26px;height:26px;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink);font-size:13px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.userbtn .un{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbtn .dot{width:8px;height:8px;background:var(--muted);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.userbtn.synced .dot{background:#2fb894}
.userbtn.warn .dot{background:var(--red)}

/* sidebar */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;align-items:start}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;position:relative;--cut:7px}
.navbtn:hover{background:var(--surface)}
.navbtn.active{background:var(--ink);color:var(--bg)}
.navbtn .gem{width:22px;height:22px}
.navbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.navbtn .ct{font-size:12px;font-weight:600;color:var(--muted);min-width:18px;text-align:right}
.navbtn.active .ct{color:var(--bg);opacity:.75}
.sidehead{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 10px 4px}
.projlist{display:flex;flex-direction:column;gap:2px}
.newproj{text-align:left;padding:8px 10px;color:var(--muted);font-weight:600;font-size:14px}
.newproj:hover{color:var(--ink)}
.navbtn.arch{margin-top:10px;color:var(--muted)}
.navbtn.arch.active{color:var(--bg)}
.sync{font-size:12px;color:var(--muted);margin:10px 10px 0}
.grip{display:grid;place-items:center;width:14px;height:22px;color:var(--muted);cursor:grab;touch-action:none;opacity:0;flex:none}
.side .grip{position:absolute;left:-14px;top:50%;transform:translateY(-50%)}
.navbtn:hover .grip,.task:hover .grip{opacity:.7}
.grip:hover{opacity:1!important}
body.sorting,body.sorting *{cursor:grabbing!important;user-select:none}
.dragging{position:relative;z-index:5;background:var(--surface)!important;box-shadow:var(--shadow);opacity:.96}
@media (hover:none){.grip{display:none}}

/* main */
.main{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);padding:18px 20px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:2px 2px 0}
.vtitle{font-size:26px;font-weight:700;line-height:1.15;margin:0}
.vsub{color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:10px 0;font-size:15px}
.empty.sm{font-size:14px;padding:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.schip{display:flex;align-items:baseline;gap:6px;padding:7px 12px;background:var(--surface);font-size:14px;color:var(--muted);--cut:6px}
.schip b{font-size:17px;color:var(--ink)}
.schip.red b{color:var(--red)}
.schip.wait b{color:var(--wait)}
button.schip:hover{background:var(--surface-2)}
.bar{display:block;height:6px;background:var(--surface-2);position:relative;overflow:hidden;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--pc,var(--gold));transition:width .3s}

/* dashboard */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}
.pcard{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pchead{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.pchead .gem{width:30px;height:30px}
.pchead .nm{font-weight:700;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchead:hover .nm{text-decoration:underline;text-underline-offset:3px}
.pchead .ct{font-size:13px;color:var(--muted);font-weight:600}
.pcard .tlist .task{padding:6px 8px;margin:0 -8px}
.pcfoot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.linkbtn{color:var(--muted);font-weight:600;font-size:13px}
.linkbtn:hover{color:var(--ink)}

/* folder chips */
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fwrap{display:inline-flex;align-items:center;min-width:0;max-width:100%}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 8px;background:var(--surface-2);font-size:13px;font-weight:600;max-width:240px;min-width:0;--cut:5px}
.fchip svg{flex:none;color:var(--pc)}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip:hover{background:var(--ink);color:var(--bg)}
.fchip:hover svg{color:inherit}
.fdel{width:24px;height:24px;color:var(--muted);font-size:16px}
.fdel:hover{color:var(--red)}
.fadd{font-size:13px;font-weight:600;color:var(--muted);padding:5px 6px}
.fadd:hover{color:var(--ink)}
.fform{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fform .field{flex:1 1 150px}
.fform .field.path{flex:3 1 260px;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px}

/* project header */
.ptop{position:relative;padding:16px 20px}
.phead{display:flex;align-items:center;gap:12px}
.phead .gem{width:36px;height:36px}
.titleinput{flex:1;min-width:0;font-size:24px;font-weight:700;border:0;background:transparent;padding:2px 6px;margin-left:-6px}
.titleinput:hover,.titleinput:focus{background:var(--surface-2)}
.pprog{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.pprog .bar{width:110px}
.menubtn{width:34px;height:34px;display:grid;place-items:center;background:var(--surface-2);font-size:18px;flex:none;--cut:6px}
.menubtn:hover{background:var(--line)}
.ptop .fchips{margin-top:12px}
.pop{position:absolute;right:16px;top:58px;z-index:20;background:var(--surface);box-shadow:var(--shadow);padding:10px;min-width:230px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line)}
.poplabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 6px}
.swatches{display:flex;gap:7px;padding:4px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.sw{width:20px;height:20px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.sw.on{transform:scale(1.3)}
.mi{text-align:left;padding:8px 8px;font-size:14px;font-weight:600}
.mi:hover{background:var(--surface-2)}
.mi.red{color:var(--red)}

/* add bar */
.addbar{display:flex;gap:8px;margin-bottom:6px}
.addbar .field{flex:1;font-size:16px;padding:11px 14px}
.addbar select.field{flex:0 1 190px;font-size:14px}
.addbar .field:placeholder-shown ~ .go{display:none}

/* sections */
.sect{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 0 2px}
.sect:first-child{margin-top:2px}
.sect .n{letter-spacing:0;font-weight:600}
.sect.red{color:var(--red)}
.sect.orange{color:var(--orange)}
.sect.wait{color:var(--wait)}

/* task rows */
.tlist{display:flex;flex-direction:column}
.titem{position:relative}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;margin:0 -10px;cursor:pointer;position:relative;--cut:6px}
.task:hover{background:var(--surface-2)}
.task .grip{position:absolute;left:-14px;top:9px}
.check{width:24px;height:24px;flex:none;position:relative;margin-top:0}
.check svg{width:100%;height:100%;display:block}
.check .ring{fill:none;stroke:var(--muted);stroke-width:2}
.check .fill{fill:var(--pc);opacity:0;transform-origin:center;transform:scale(.4);transition:all .2s}
.check .tick{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.check:hover .ring{stroke:var(--pc)}
.check:hover .fill{opacity:.2;transform:scale(1)}
.done>.task .check .fill,.sub.done .check .fill,.dstep.done .check .fill,.dtitle.done .check .fill{opacity:1!important;transform:scale(1)}
.done>.task .check .tick,.sub.done .check .tick,.dstep.done .check .tick,.dtitle.done .check .tick{opacity:1}
.done>.task .check .ring,.sub.done .check .ring,.dstep.done .check .ring,.dtitle.done .check .ring{stroke:var(--pc)}
.tbody{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:3px;padding-top:1px}
.ttext{word-break:break-word}
.done>.task .ttext{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.waiting>.task .ttext{color:var(--muted)}
.meta{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);padding:1px 7px;background:var(--surface-2);white-space:nowrap;line-height:1.6}
.task:hover .meta{background:var(--surface)}
.meta.over{color:var(--red)}
.meta.today{color:var(--orange)}
.meta.wait{color:var(--wait)}
.meta.proj{color:#fff;background:var(--pc)!important;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);padding:1px 9px}
button.meta:hover{color:var(--ink)}
.meta.full{color:var(--pc)}
.mbar{display:inline-block;width:28px;height:5px;background:var(--line);position:relative}
.mbar i{position:absolute;inset:0 auto 0 0;background:var(--pc)}
.tacts{display:flex;gap:0;flex:none;align-self:center}
.tact{width:26px;height:26px;color:var(--muted);font-size:15px;opacity:0}
.task:hover .tact,.tact.on,.tact:focus-visible{opacity:1}
.tact.star.on{color:var(--gold)}
.tact.sun.on{color:var(--orange)}
.tact:hover{color:var(--ink)}
@media (hover:none){.tact:not(.on){display:none}}
.fresh>.task{animation:fresh 1.2s ease}
@keyframes fresh{0%{background:color-mix(in srgb,var(--pc) 28%,transparent)}100%{background:transparent}}

/* inline steps */
.subs{margin:0 0 6px 21px;padding:0 0 2px 22px;border-left:2px solid var(--line)}
.sub{display:flex;align-items:center;gap:9px;padding:4px 8px;margin-left:-8px;cursor:pointer}
.sub:hover{background:var(--surface-2)}
.sub .check{width:20px;height:20px}
.stext{flex:1;min-width:0;font-size:15px;word-break:break-word}
.sub.done .stext{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.addstep{font-size:13px;color:var(--muted);padding:4px 0;font-weight:600}
.addstep:hover{color:var(--ink)}
.subin{width:100%;font-size:14px;padding:6px 10px;margin:3px 0}

/* fold cards */
.fold{padding:12px 20px}
.foldhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-weight:600;padding:4px 0}
.foldhead .chev{color:var(--muted);width:12px;font-size:12px;flex:none}
.foldhead .dn{font-size:12px;padding:1px 8px;background:var(--surface-2);color:var(--muted);flex:none}
.foldhead .prev{flex:1;min-width:0;color:var(--muted);font-weight:400;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foldhead:hover .chev{color:var(--ink)}
.foldbody{margin-top:8px}
.notes{width:100%;min-height:150px;resize:vertical;background:var(--surface-2);border:0;padding:12px 14px;line-height:1.5;display:block}
.danger{color:var(--muted);font-size:13px;font-weight:600;padding:8px 0 2px}
.danger:hover{color:var(--red)}

/* archive */
.arow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .nm{flex:1;min-width:0;font-weight:600}
.arow .sm{font-size:13px;color:var(--muted)}

/* hero */
.hero{text-align:center;padding:56px 24px}
.hero .gem{width:88px;height:88px;margin:0 auto 14px;display:block}
.hero h1{font-size:28px;margin:0 0 8px}
.hero p{color:var(--muted);margin:0 auto 22px;max-width:44ch}
.hero .go{padding:13px 22px;font-size:17px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:41;background:var(--surface);transform:translateX(105%);transition:transform .22s ease;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dtop{display:flex;align-items:center;gap:8px;padding:12px 14px 12px 18px;border-bottom:1px solid var(--line)}
.dtop .field{font-size:14px;font-weight:600;max-width:70%}
.dtop .sp{flex:1}
.dbody{flex:1;overflow:auto;padding:18px}
.dtitle{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.dtitle .check{margin-top:4px}
.dtitle textarea{flex:1;font-size:20px;font-weight:700;border:0;background:transparent;resize:none;padding:2px 6px;margin-left:-6px;line-height:1.3;overflow:hidden;min-height:34px}
.dtitle textarea:hover,.dtitle textarea:focus{background:var(--surface-2)}
.dtitle.done textarea{text-decoration:line-through;color:var(--muted)}
.prop{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pl{font-size:13px;color:var(--muted);font-weight:600}
.pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.pill{padding:5px 10px;font-size:13px;font-weight:600;background:var(--surface-2);--cut:5px}
.pill.on{background:var(--ink);color:var(--bg)}
.pill:hover:not(.on){background:var(--line)}
.pill.wait.on{background:var(--wait);color:#fff}
.pv input[type=date]{padding:5px 8px;font-size:14px}
.pv .wfor{flex:1 1 140px;padding:6px 10px;font-size:14px}
.progsel{display:flex;gap:2px;align-items:center}
.progsel button{width:14px;height:18px;background:var(--line);clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)}
.progsel button.on{background:var(--pc)}
.progsel button:hover{background:var(--pc);opacity:.7}
.pct{font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.dsect{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.dsect h4{display:flex;gap:8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.dstep{display:flex;align-items:center;gap:8px;padding:2px 0}
.dstep .check{width:20px;height:20px}
.dstep input{flex:1;padding:6px 8px;font-size:15px;background:transparent}
.dstep input:hover,.dstep input:focus{background:var(--surface-2)}
.dstep.done input{color:var(--muted);text-decoration:line-through}
.x{width:28px;height:28px;flex:none;color:var(--muted);font-size:18px;line-height:1}
.x:hover{color:var(--red)}
.dstep .x{opacity:0}
.dstep:hover .x,.dstep:focus-within .x{opacity:1}
@media (hover:none){.dstep .x{opacity:1}}
#dnewstep{width:100%;margin-top:6px;font-size:14px;padding:8px 10px}
.dfoot{display:flex;align-items:center;gap:6px;padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.dfoot .mv{width:30px;height:30px;background:var(--surface-2);font-size:14px}
.dfoot .del{margin-left:auto;color:var(--red);font-weight:600;font-size:13px;padding:6px 4px}
@media (hover:hover){.dfoot .mv{display:none}}

/* search */
.search{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:rgba(10,16,24,.5)}
.search.open{display:flex}
.sbox{width:100%;max-width:600px;background:var(--surface);max-height:70vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sbox input{border:0;background:transparent;font-size:18px;padding:16px 18px;border-bottom:1px solid var(--line);width:100%}
.sres{overflow:auto;padding:6px}
.sgrp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 12px 4px;font-weight:700}
.sitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px}
.sitem.sel{background:var(--surface-2)}
.sitem .gem{width:18px;height:18px}
.sitem .s1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .s1.done{text-decoration:line-through;color:var(--muted)}
.sitem .s2{font-size:12px;color:var(--muted);flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem svg.fi{color:var(--pc);flex:none}
.sempty{padding:16px 18px;color:var(--muted);font-size:14px}
.shint{padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* fx */
.shard{position:fixed;width:9px;height:9px;pointer-events:none;z-index:80;clip-path:polygon(50% 0,100% 100%,0 100%)}
.float{position:fixed;pointer-events:none;z-index:80;font-weight:700;color:var(--gold);font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 18px;font-weight:600;opacity:0;transition:all .25s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.gold{background:var(--gold);color:var(--gold-ink)}

/* sign-in modal */
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,16,24,.55)}
.modal.open{display:flex}
.mbox{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:24px}
.mbox h3{margin:0 0 6px;font-size:22px}
.mbox p{color:var(--muted);margin:0 0 14px}
.mbox ol{margin:0 0 16px;padding-left:20px}
.mbox li{margin-bottom:6px}
.mbox a{color:var(--focus)}
.mbox .field{width:100%;margin-bottom:10px;font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.merr{color:var(--red);font-size:14px;min-height:20px;margin-bottom:8px}
.who{font-size:18px;font-weight:600;margin-bottom:14px}

/* week calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar .rng{font-weight:700;font-size:20px;margin:0 8px 0 4px}
.calbar .sp{flex:1}
.calbar .ghost{padding:7px 12px;font-size:14px}
.calbar .pill{padding:7px 12px;font-size:13px}
.calbar .nb{width:34px;height:34px;display:grid;place-items:center;background:var(--surface);font-size:15px;--cut:6px}
.calbar .nb:hover{background:var(--surface-2)}
.meetbtn{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface);font-size:13px;font-weight:600;--cut:6px}
.meetbtn:hover{background:var(--surface-2)}
.meetbtn i{width:12px;height:12px;background:var(--mc);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.calwrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;align-items:start}
.tray{padding:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:10px;transition:box-shadow .15s}
.tray h3{margin:0;font-size:15px}
.tray select.field{width:100%;font-size:13px;padding:7px 28px 7px 10px}
.traylist{overflow:auto;display:flex;flex-direction:column;gap:4px;min-height:40px}
.tchip{display:flex;flex-direction:column;gap:1px;padding:7px 9px 7px 13px;background:var(--surface-2);cursor:grab;touch-action:none;position:relative;font-size:14px;line-height:1.3;--cut:5px;user-select:none}
.tchip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.tchip .tp{font-size:12px;color:var(--muted)}
.tchip .tp b{font-weight:600}
.tchip .tp b.over{color:var(--red)}
.tchip:hover{background:var(--line)}
.tray.drop{box-shadow:inset 0 0 0 2px var(--focus)}
.trayhint{font-size:12px;color:var(--muted);line-height:1.4}
.cal{background:var(--surface);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.calgrid{display:grid;grid-template-columns:52px repeat(var(--n),minmax(0,1fr))}
.calhead>div{padding:8px 8px 6px;font-size:13px;color:var(--muted);border-left:1px solid var(--line)}
.calhead>div:first-child{border-left:0}
.calhead .dnum{display:block;font-size:20px;font-weight:700;color:var(--ink);line-height:1.15}
.calhead .today{box-shadow:inset 0 -3px 0 var(--gold);color:var(--ink)}
.calallday{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.calallday>div{min-height:30px;padding:3px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.calallday>.gl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-items:center;justify-content:center;border-left:0;font-weight:600}
.adchip{font-size:12px;font-weight:600;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:color-mix(in srgb,var(--pc) 22%,var(--surface));border-left:3px solid var(--pc);cursor:grab;touch-action:none;user-select:none}
.adchip.meet{--pc:var(--mc);cursor:default}
.calscroll{overflow:auto;max-height:calc(100vh - 230px);min-height:380px;position:relative;overscroll-behavior:contain}
.calbody{position:relative}
.gutter{position:relative}
.gutter span{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-50%);white-space:nowrap}
.calcol{position:relative;border-left:1px solid var(--line);cursor:cell;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line) 50%,transparent) 1px,transparent 1px);
  background-size:100% var(--ph),100% var(--ph);background-position:0 0,0 calc(var(--ph) / 2)}
.calcol.today{background-color:color-mix(in srgb,var(--focus) 7%,transparent)}
.calcol.past{background-color:color-mix(in srgb,var(--bg) 45%,transparent)}
.cev{position:absolute;overflow:hidden;padding:3px 6px 3px 8px;font-size:12px;line-height:1.3;--cut:4px;z-index:1;color:var(--ink)}
.cev.ctask{background:color-mix(in srgb,var(--pc) 26%,var(--surface));border-left:3px solid var(--pc);cursor:grab;touch-action:none;user-select:none}
.cev.ctask:hover{background:color-mix(in srgb,var(--pc) 36%,var(--surface))}
.cev.ctask.done{opacity:.55}
.cev.ctask.done .cevt{text-decoration:line-through}
.cev.meet{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--mc) 22%,var(--surface)) 0 6px,color-mix(in srgb,var(--mc) 14%,var(--surface)) 6px 12px);border-left:3px solid var(--mc);cursor:default}
.cev.meet.pastev,.cev.ctask.pastev{opacity:.6}
.cevt{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.cevs{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cev .ccheck{position:absolute;top:3px;right:3px;width:16px;height:16px;z-index:2}
.cev.ctask .cevt,.cev.ctask .cevs{padding-right:16px}
.cev.done .ccheck .fill{opacity:1;transform:scale(1)}
.cev.done .ccheck .tick{opacity:1}
.cev.done .ccheck .ring{stroke:var(--pc)}
.rz{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.cev.dragging{box-shadow:var(--shadow);z-index:6;opacity:.92}
.cev.preview{opacity:.75;box-shadow:var(--shadow);z-index:6;pointer-events:none}
.csel{position:absolute;left:2px;right:2px;background:color-mix(in srgb,var(--focus) 20%,transparent);border:1px dashed var(--focus);z-index:3;font-size:11px;font-weight:600;padding:2px 6px;pointer-events:none}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;background:var(--red);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.dragchip{position:fixed;z-index:85;pointer-events:none;padding:6px 10px 6px 12px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600;border-left:4px solid var(--pc);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qadd{position:fixed;z-index:65;background:var(--surface);box-shadow:var(--shadow);padding:12px;width:290px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.qadd .qt{font-size:12px;color:var(--muted);font-weight:600}
.qadd .field{width:100%}
.qadd .row{display:flex;gap:8px;justify-content:flex-end}
.mswatch{display:flex;gap:8px;margin:4px 0 14px}
.mswatch .sw{width:22px;height:22px}
.mfile{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.mstat{font-size:13px;color:var(--muted);margin-bottom:12px}
@media (max-width:1000px){
  .calwrap{grid-template-columns:1fr}
  .tray{position:static;max-height:none}
  .traylist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .tchip{flex:none;max-width:200px}
}
@media (max-width:760px){
  .cal{overflow-x:auto}
  .calhead,.calallday,.calscroll{min-width:620px}
  .calscroll{max-height:none;min-height:0}
}
@media (max-width:900px){
  .searchbtn{min-width:0}
  .searchbtn .lbl,.searchbtn kbd{display:none}
  .xpbar{display:none}
}
@media (max-width:760px){
  .app{padding:12px 12px 50px}
  .top{gap:8px;margin-bottom:12px}
  .brand{font-size:0;gap:0}
  .searchbtn{padding:0 12px}
  .userbtn .un{display:none}
  .layout{grid-template-columns:1fr;gap:12px}
  .side{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .projlist{display:contents}
  .navbtn{width:auto;flex:none;max-width:200px;background:var(--surface)}
  .navbtn.arch{margin-top:0}
  .sidehead,.sync{display:none}
  .newproj{flex:none;white-space:nowrap}
  .panel{padding:14px 16px}
  .ptop{padding:14px 16px}
  .titleinput{font-size:20px}
  .pprog .bar{display:none}
  .vtitle{font-size:22px}
  .grid{grid-template-columns:1fr}
  .addbar{flex-wrap:wrap}
  .addbar select.field{flex-basis:100%}
  .pop{right:10px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<body>
<div id="facets" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand"><span id="brandGem"></span>Quest Log</div>
    <button class="searchbtn cut" data-act="search" aria-label="Search (Ctrl+K)"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M6.8 1.8 11.2 4.3v5L6.8 11.8 2.4 9.3v-5zM10.4 10.4l4 4"/></svg><span class="lbl">Search tasks, folders…</span><kbd>Ctrl K</kbd></button>
    <div class="xp cut" id="xpbox"><span class="lvl" id="lvl">Lv 1</span><span class="xpbar" id="xpbar"></span></div>
    <button class="iconbtn cut" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark mode">◐</button>
    <button class="userbtn cut" id="syncBtn" title="Account" hidden>Sign in</button>
  </header>
  <div class="layout">
    <nav class="side" id="side" aria-label="Views and projects"></nav>
    <main class="main" id="main"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Task details" aria-hidden="true" tabindex="-1"></aside>
<div class="search" id="search" role="dialog" aria-modal="true" aria-label="Search">
  <div class="sbox cut"><input id="sq" placeholder="Search tasks, projects and folders" aria-label="Search" autocomplete="off" spellcheck="false"><div class="sres" id="sres" role="listbox"></div><div class="shint">↑ ↓ to move · Enter to open · folders copy their path · Esc to close</div></div>
</div>
<div class="toast cut" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="syncModal" role="dialog" aria-modal="true" aria-labelledby="syncTitle">
  <div class="mbox cut" id="syncBox"></div>
</div>
<script>
(function(){
const COLORS=["#2fb894","#4f86e8","#ee6a5f","#9a6ee8","#f08c3a","#27a9c9","#d4508f","#7a9b2e"];
const KEY="questlog.v1", UIKEY="questlog.ui";
const XP_PER=10, XP_LVL=100;
const blank=()=>({projects:[],xp:0,log:{},updatedAt:0});
function normalize(s){
  s.projects=Array.isArray(s.projects)?s.projects:[];
  s.projects.forEach(p=>{p.folders=p.folders||[];p.tasks=p.tasks||[];if(!p.color)p.color=COLORS[0];});
  s.log=s.log||{};s.xp=s.xp||0;
  return s;
}
function load(){
  try{const s=localStorage.getItem(KEY); if(s) return normalize(Object.assign(blank(),JSON.parse(s)));}catch(e){}
  return blank();
}
let state=load();
const ui=(()=>{
  let u={};try{u=JSON.parse(localStorage.getItem(UIKEY)||"{}")||{};}catch(e){}
  u.fold=u.fold||{};u.subs=u.subs||{};
  if(!u.view) u.view=(state.view&&state.view!=="all")?state.view:"home";
  if(state.showDone) Object.keys(state.showDone).forEach(k=>{if(!(("done:"+k) in u.fold)) u.fold["done:"+k]=!!state.showDone[k];});
  if(state.openSubs) Object.keys(state.openSubs).forEach(k=>{if(!(k in u.subs)) u.subs[k]=!!state.openSubs[k];});
  return u;
})();
function saveUI(){try{localStorage.setItem(UIKEY,JSON.stringify(ui));}catch(e){}}
let pendingFocus=null, editing=null, drawerId=null, drawerFocus=null, menuOpen=false, folderForm=false, stepAdding=null, lastAdded=null;

const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const keyOf=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();};
const dayKey=()=>keyOf(Date.now());
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return isoOf(d);};
const parseISO=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);};
const daysUntil=s=>Math.round((parseISO(s)-parseISO(todayISO()))/864e5);
function dueLabel(s){
  const n=daysUntil(s), d=parseISO(s);
  const short=d.toLocaleDateString(undefined,{day:"numeric",month:"short"});
  if(n<0) return {t:"Overdue · "+(n===-1?"yesterday":short),c:"over"};
  if(n===0) return {t:"Due today",c:"today"};
  if(n===1) return {t:"Tomorrow",c:""};
  if(n<7) return {t:d.toLocaleDateString(undefined,{weekday:"short"}),c:""};
  return {t:short,c:""};
}
const proj=id=>state.projects.find(p=>p.id===id);
const active=()=>state.projects.filter(p=>!p.archived);
const todo=t=>!t.done&&!t.wait;
const todoCount=p=>p.tasks.filter(todo).length;
const projFrac=p=>p.tasks.length?p.tasks.reduce((a,t)=>a+(t.done?1:(t.prog||0)/100),0)/p.tasks.length:0;
const inToday=t=>!t.done&&(!!t.day||(!!t.due&&t.due<=todayISO())||(!!t.slot&&t.slot.s.slice(0,10)===todayISO()));
const doneToday=t=>t.done&&t.doneAt&&keyOf(t.doneAt)===dayKey();
function allTasks(){const r=[];active().forEach(p=>p.tasks.forEach(t=>r.push({p,t})));return r;}
function findTask(id){for(const p of state.projects){const t=p.tasks.find(x=>x.id===id);if(t)return {p,t};}return null;}
const validView=v=>v==="home"||v==="today"||v==="all"||v==="week"||v==="archive"||(!!proj(v)&&!proj(v).archived);
const orderKey=x=>state.projects.indexOf(x.p)*100000+x.p.tasks.indexOf(x.t);
function rank(a,b){
  const da=a.t.due||"9999", db=b.t.due||"9999";
  if(da!==db) return da<db?-1:1;
  if(!!a.t.pri!==!!b.t.pri) return a.t.pri?-1:1;
  return orderKey(a)-orderKey(b);
}
const folderName=f=>f.label||(f.path.split(/[\\/]/).filter(Boolean).pop())||f.path;
const lvl=()=>Math.floor(Math.max(0,state.xp)/XP_LVL);

/* icons */
const gripSVG='<svg viewBox="0 0 10 16" width="9" height="15" aria-hidden="true"><g fill="currentColor"><rect x="1" y="1" width="3" height="3"/><rect x="6" y="1" width="3" height="3"/><rect x="1" y="6.5" width="3" height="3"/><rect x="6" y="6.5" width="3" height="3"/><rect x="1" y="12" width="3" height="3"/><rect x="6" y="12" width="3" height="3"/></g></svg>';
const folderSVG='<svg viewBox="0 0 16 14" width="15" height="13" aria-hidden="true"><path fill="currentColor" opacity=".45" d="M0 2.5 1.5 1h4.5l1.5 1.5H16V5H0z"/><path fill="currentColor" d="M0 5h16v7.5L14.5 14H0z"/></svg>';
const notesSVG='<svg viewBox="0 0 14 14" width="11" height="11" aria-hidden="true"><path fill="currentColor" d="M1 2h12v2H1zM1 6h12v2H1zM1 10h8v2H1z"/></svg>';
const clockSVG='<svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M7 1.3 12 4.1v5.8L7 12.7 2 9.9V4.1z M7 4.2v3l2 1.3"/></svg>';
const homeSVG='<svg class="gem" viewBox="0 0 100 100" aria-hidden="true"><g fill="var(--gold)"><polygon points="28,6 50,28 28,50 6,28"/><polygon points="72,6 94,28 72,50 50,28" opacity=".55"/><polygon points="28,50 50,72 28,94 6,72" opacity=".55"/><polygon points="72,50 94,72 72,94 50,72" opacity=".8"/></g></svg>';
const checkSVG='<svg viewBox="0 0 26 26" aria-hidden="true"><polygon class="fill" points="7,2 19,2 24,7 24,19 19,24 7,24 2,19 2,7"/><polygon class="ring" points="7,2 19,2 24,7 24,19 19,24 7,24 2,19 2,7"/><path class="tick" d="M7.5 13.5l3.8 3.8 7.2-7.8"/></svg>';
function gemSVG(color,progress){
  const lit=Math.round(progress*6);
  const pts=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-90);pts.push([50+44*Math.cos(a),50+44*Math.sin(a)]);}
  let s='<svg class="gem" viewBox="0 0 100 100" aria-hidden="true">';
  for(let i=0;i<6;i++){
    const a=pts[i],b=pts[(i+1)%6],on=i<lit,shade=[0,.18,.32,.12,.26,.06][i];
    const poly=`50,50 ${a[0].toFixed(1)},${a[1].toFixed(1)} ${b[0].toFixed(1)},${b[1].toFixed(1)}`;
    s+=`<polygon points="${poly}" fill="${color}" fill-opacity="${on?1:.85}"/><polygon points="${poly}" fill="#000" fill-opacity="${on?shade:shade*.5+.22}"/>`;
  }
  return s+"</svg>";
}
function drawFacets(){
  const W=1200,H=800,cols=12,rows=8,cw=W/cols,rh=H/rows;let seed=7;
  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const P=[];for(let r=0;r<=rows;r++){P[r]=[];for(let c=0;c<=cols;c++){
    const edge=(r===0||r===rows||c===0||c===cols);
    P[r][c]=[c*cw+(edge?0:(rnd()-.5)*cw*.7),r*rh+(edge?0:(rnd()-.5)*rh*.7)];}}
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">`;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const a=P[r][c],b=P[r][c+1],d=P[r+1][c],e=P[r+1][c+1];
    const tris=rnd()>.5?[[a,b,e],[a,e,d]]:[[a,b,d],[b,e,d]];
    tris.forEach(t=>{const o=(0.015+rnd()*0.07+(r/rows)*0.04).toFixed(3);
      s+=`<polygon points="${t.map(p=>p[0].toFixed(0)+","+p[1].toFixed(0)).join(" ")}" fill="var(--facet)" fill-opacity="${o}"/>`;});
  }
  $("facets").innerHTML=s+"</svg>";
}

/* ---------- persistence: this device + your claude.ai account ---------- */
let docRef=null, saveTimer=null, syncLabel="Saved on this device";
const GFILE="questlog.json";
const GH={tok:null,id:null,user:null};
try{GH.tok=localStorage.getItem("questlog.ghtoken");GH.id=localStorage.getItem("questlog.gistid");GH.user=localStorage.getItem("questlog.ghuser");}catch(e){}
function save(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  clearTimeout(saveTimer);
  if(docRef) saveTimer=setTimeout(()=>{docRef.set({json:JSON.stringify(state),updatedAt:state.updatedAt}).catch(()=>{});},700);
  if(GH.tok&&GH.id) gistPushSoon();
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.collection("data/users/"+id).doc("questlog");
    const snap=await ref.get();
    if(snap.exists){
      const d=snap.data();
      if(d&&d.json&&(d.updatedAt||0)>(state.updatedAt||0)){
        const view=state.view;
        state=normalize(Object.assign(blank(),JSON.parse(d.json)));
        if(proj(view)||view==="all"||view==="today") state.view=view;
        try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
      }
    }
    docRef=ref; syncLabel="Synced to your account";
    if(!snap.exists||(snap.data()&&(snap.data().updatedAt||0)<state.updatedAt)) save();
    render();
  }catch(e){}
})();

/* ---------- rendering ---------- */
function render(){
  if(!validView(ui.view)) ui.view="home";
  renderHeader(); renderSide(); renderMain();
  if(pendingFocus){const el=document.querySelector(pendingFocus);if(el)el.focus();pendingFocus=null;}
}
function refreshAll(){render(); if(drawerId) renderDrawer();}
function renderHeader(){
  const xp=Math.max(0,state.xp), into=xp%XP_LVL;
  $("lvl").textContent="Lv "+(lvl()+1);
  $("xpbar").innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<into/10?"on":""}"></i>`).join("");
  $("xpbox").title=`${into} / ${XP_LVL} xp to level ${lvl()+2}`;
  $("brandGem").innerHTML=gemSVG("var(--gold)",Math.min(1,into/XP_LVL+0.17));
}
function renderSide(){
  const all=allTasks();
  const tc=all.filter(x=>inToday(x.t)).length, ac=all.filter(x=>todo(x.t)).length;
  const nav=(id,label,icon,ct)=>`<button class="navbtn cut ${ui.view===id?"active":""}" data-act="view" data-id="${id}">${icon}<span class="nm">${label}</span><span class="ct">${ct||""}</span></button>`;
  let h=nav("home","Home",homeSVG,"")+nav("today","Today",gemSVG("#f08c3a",1),tc)+nav("all","All tasks",gemSVG("var(--gold)",1),ac)+nav("week","Week",calSVG,"");
  h+=`<div class="sidehead">Projects</div><div class="projlist" data-sort="projects">`;
  h+=active().map(p=>`<button class="navbtn cut ${ui.view===p.id?"active":""}" data-act="view" data-id="${p.id}" data-sid="${p.id}"><span class="grip" data-grip title="Drag to reorder">${gripSVG}</span>${gemSVG(p.color,projFrac(p))}<span class="nm">${esc(p.name)}</span><span class="ct">${todoCount(p)||""}</span></button>`).join("");
  h+=`</div><button class="newproj" data-act="newproj">+ New project</button>`;
  const arch=state.projects.filter(p=>p.archived).length;
  if(arch) h+=`<button class="navbtn cut arch ${ui.view==="archive"?"active":""}" data-act="view" data-id="archive"><span class="nm">Archive</span><span class="ct">${arch}</span></button>`;
  h+=`<div class="sync">${esc(syncLabel)}</div>`;
  $("side").innerHTML=h;
}
function renderMain(){
  const v=ui.view;
  const sc=$("calscroll");if(sc) calScroll=sc.scrollTop; else calScroll=null;
  $("main").innerHTML=v==="home"?homeHTML():v==="today"?todayHTML():v==="all"?allHTML():v==="week"?weekHTML():v==="archive"?archiveHTML():projectHTML(proj(v));
  if(v==="week") afterWeekRender();
  if(lastAdded) setTimeout(()=>{lastAdded=null;},1300);
}

/* one task row; o = {proj:show project tag, ctx:"project"|"list"|"card", sort:draggable} */
function taskItem(p,t,o){
  const steps=t.subs||[], sd=steps.filter(s=>s.done).length;
  const sOpen=steps.length>0&&((t.id in ui.subs)?ui.subs[t.id]:(o.ctx==="project"&&!t.done));
  let meta="";
  if(o.proj) meta+=`<button class="meta proj" style="--pc:${p.color}" data-act="view" data-id="${p.id}">${esc(p.name)}</button>`;
  if(t.wait&&!t.done) meta+=`<span class="meta wait">${clockSVG}Waiting${t.waitFor?" · "+esc(t.waitFor):""}</span>`;
  if(t.due&&!t.done){const d=dueLabel(t.due);meta+=`<span class="meta ${d.c}">${d.t}</span>`;}
  if(steps.length) meta+=`<button class="meta ${sd===steps.length?"full":""}" data-act="subs" aria-expanded="${sOpen}" title="${sOpen?"Hide":"Show"} steps">${sOpen?"▾":"▸"} ${sd}/${steps.length}</button>`;
  if(!t.done) meta+=slotMeta(t);
  if(t.prog&&!t.done) meta+=`<span class="meta"><span class="mbar"><i style="width:${t.prog}%"></i></span>${t.prog}%</span>`;
  if(t.notes&&t.notes.trim()) meta+=`<span class="meta" title="Has notes">${notesSVG}</span>`;
  return `<div class="titem ${t.done?"done":""} ${t.wait&&!t.done?"waiting":""} ${t.id===lastAdded?"fresh":""}" data-tid="${t.id}" style="--pc:${p.color}">
    <div class="task cut" data-act="open">
      ${o.sort?`<span class="grip" data-grip title="Drag to reorder">${gripSVG}</span>`:""}
      <button class="check" role="checkbox" aria-checked="${!!t.done}" aria-label="${t.done?"Mark not done":"Mark done"}: ${esc(t.text)}" data-act="toggle">${checkSVG}</button>
      <div class="tbody"><span class="ttext">${esc(t.text)}</span>${meta}</div>
      ${t.done?"":`<div class="tacts"><button class="tact sun ${t.day?"on":""}" data-act="sun" aria-label="${t.day?"Remove from today":"Add to today"}" title="${t.day?"On today’s list":"Add to today"}">☀︎</button><button class="tact star ${t.pri?"on":""}" data-act="pri" aria-label="${t.pri?"Unstar":"Star"}" title="Star">★</button></div>`}
    </div>
    ${sOpen?subsHTML(t):""}
  </div>`;
}
function subsHTML(t){
  return `<div class="subs">${(t.subs||[]).map(s=>`<div class="sub ${s.done?"done":""}" data-sid="${s.id}" data-act="subtoggle"><button class="check" role="checkbox" aria-checked="${!!s.done}" aria-label="Step: ${esc(s.text)}">${checkSVG}</button><span class="stext">${esc(s.text)}</span></div>`).join("")}
    ${stepAdding===t.id?`<input class="field subin" id="subin" placeholder="New step, press Enter" aria-label="New step">`:`<button class="addstep" data-act="addstep">+ Step</button>`}</div>`;
}
const list=(items,o)=>`<div class="tlist" ${o.sort?`data-sort="tasks" data-pid="${o.pid}"`:""}>${items.map(x=>taskItem(x.p,x.t,o)).join("")}</div>`;
function fold(k,title,count,body,preview){
  const open=!!ui.fold[k];
  return `<section class="panel cut fold"><button class="foldhead" data-act="fold" data-k="${k}" aria-expanded="${open}"><span class="chev">${open?"▾":"▸"}</span><span>${title}</span>${count!=null?`<span class="dn">${count}</span>`:""}${preview&&!open?`<span class="prev">${esc(preview)}</span>`:""}</button>${open?`<div class="foldbody">${body}</div>`:""}</section>`;
}
function chipsHTML(p,edit,limit){
  const fs=limit?p.folders.slice(0,limit):p.folders;
  let h=fs.map(f=>`<span class="fwrap"><button class="fchip cut" style="--pc:${p.color}" data-act="copyf" data-pid="${p.id}" data-fid="${f.id}" title="${esc(f.path)}&#10;Click to copy">${folderSVG}<span>${esc(folderName(f))}</span></button>${edit?`<button class="fdel" data-act="delf" data-fid="${f.id}" aria-label="Remove ${esc(folderName(f))}">×</button>`:""}</span>`).join("");
  if(limit&&p.folders.length>limit) h+=`<button class="fadd" data-act="view" data-id="${p.id}">+${p.folders.length-limit} more</button>`;
  return h;
}
function heroHTML(){
  return `<section class="panel cut hero">${gemSVG("var(--gold)",0)}<h1>Start your first quest</h1>
    <p>Make a project for each job you’re juggling. Save its folders, add tasks, and tick them off to earn xp.</p>
    <button class="go cut" data-act="newproj">Create a project</button></section>`;

const dateLong=()=>new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});

function homeHTML(){
  if(!active().length) return heroHTML();
  const all=allTasks(), t0=todayISO();
  const over=all.filter(x=>todo(x.t)&&x.t.due&&x.t.due<t0).length;
  const tod=all.filter(x=>inToday(x.t)).length;
  const wait=all.filter(x=>!x.t.done&&x.t.wait).length;
  const dn=state.log[dayKey()]||0;
  const hr=new Date().getHours();
  const hi=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  let chips="";
  if(over) chips+=`<button class="schip cut red" data-act="view" data-id="all"><b>${over}</b>overdue</button>`;
  chips+=`<button class="schip cut" data-act="view" data-id="today"><b>${tod}</b>on today’s list</button>`;
  if(wait) chips+=`<button class="schip cut wait" data-act="view" data-id="all"><b>${wait}</b>waiting</button>`;
  chips+=`<span class="schip cut"><b>${dn}</b>done today</span>`;
  const cards=active().map(p=>{
    const next=p.tasks.filter(todo).map(t=>({p,t})).sort(rank).slice(0,3);
    const n=todoCount(p), w=p.tasks.filter(t=>!t.done&&t.wait).length, f=projFrac(p);
    return `<article class="pcard cut" style="--pc:${p.color}">
      <button class="pchead" data-act="view" data-id="${p.id}">${gemSVG(p.color,f)}<span class="nm">${esc(p.name)}</span><span class="ct">${Math.round(f*100)}%</span></button>
      <span class="bar"><i style="width:${f*100}%"></i></span>
      ${p.folders.length?`<div class="fchips">${chipsHTML(p,false,4)}</div>`:""}
      ${next.length?list(next,{ctx:"card"}):`<div class="empty sm">${p.tasks.length?(w?"Only waiting tasks left":"All done"):"No tasks yet"}</div>`}
      <div class="pcfoot"><span>${n} to do${w?` · ${w} waiting`:""}</span><button class="linkbtn" data-act="view" data-id="${p.id}">Open →</button></div>
    </article>`;
  }).join("");
  return `<div class="vhead"><div><h1 class="vtitle">${hi}</h1><div class="vsub">${dateLong()}</div></div><div class="chips">${chips}</div></div><div class="grid">${cards}</div>`;
}

function todayHTML(){
  if(!active().length) return heroHTML();
  const items=allTasks().filter(x=>inToday(x.t)).sort((a,b)=>{const sa=a.t.slot&&a.t.slot.s.slice(0,10)===todayISO(),sb=b.t.slot&&b.t.slot.s.slice(0,10)===todayISO();if(sa!==sb)return sa?-1:1;if(sa)return a.t.slot.s<b.t.slot.s?-1:1;return rank(a,b);});
  const done=allTasks().filter(x=>doneToday(x.t)).sort((a,b)=>b.t.doneAt-a.t.doneAt);
  const tot=items.length+done.length;
  const sel=proj(ui.lastProj)&&!proj(ui.lastProj).archived?ui.lastProj:active()[0].id;
  return `<div class="vhead"><div><h1 class="vtitle">Today</h1><div class="vsub">${dateLong()}</div></div><div class="vsub">${tot?`${done.length} of ${tot} done`:""}</div></div>
  <section class="panel cut" style="--pc:#f08c3a">
    <div class="addbar"><select class="field" id="todayproj" aria-label="Project">${active().map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
      <input class="field" id="todaytask" placeholder="Add a task for today" aria-label="New task for today"><button class="go cut" data-act="addtoday">Add</button></div>
    ${items.length?list(items,{proj:true,ctx:"list"}):`<div class="empty">Nothing planned. Tap ☀ on any task to add it here. Tasks due today appear automatically.</div>`}
  </section>
  ${done.length?fold("today-done","Completed today",done.length,list(done,{proj:true,ctx:"list"})):""}`;
}

function allHTML(){
  const all=allTasks(), t0=todayISO(), wk=addDays(7);
  const open=all.filter(x=>todo(x.t)).sort(rank);
  const g=[
    ["Overdue","red",open.filter(x=>x.t.due&&x.t.due<t0)],
    ["Due today","orange",open.filter(x=>x.t.due===t0)],
    ["Next 7 days","",open.filter(x=>x.t.due&&x.t.due>t0&&x.t.due<=wk)],
    ["Later","",open.filter(x=>x.t.due&&x.t.due>wk)],
    ["No date","",open.filter(x=>!x.t.due)]
  ].filter(x=>x[2].length);
  const wait=all.filter(x=>!x.t.done&&x.t.wait).sort(rank);
  return `<div class="vhead"><div><h1 class="vtitle">All tasks</h1><div class="vsub">${open.length} to do across ${active().length} project${active().length===1?"":"s"}</div></div></div>
  <section class="panel cut">${g.length?g.map(x=>`<div class="sect ${x[1]}">${x[0]} <span class="n">${x[2].length}</span></div>${list(x[2],{proj:true,ctx:"list"})}`).join(""):`<div class="empty">Nothing to do. Enjoy it.</div>`}</section>
  ${wait.length?fold("all-wait",`<span style="color:var(--wait)">Waiting on others</span>`,wait.length,list(wait,{proj:true,ctx:"list"})):""}`;
}

  <section class="panel cut">${arch.map(p=>`<div class="arow">${gemSVG(p.color,projFrac(p))}<div class="nm">${esc(p.name)}<div class="sm">${p.tasks.filter(t=>t.done).length} of ${p.tasks.length} tasks done</div></div>

}

  const pop=menuOpen?`<div class="pop cut" role="menu"><div class="poplabel">Colour</div>
      <div class="swatches">${COLORS.map(c=>`<button class="sw ${c===p.color?"on":""}" style="background:${c}" data-act="color" data-c="${c}" aria-label="Colour ${c}"></button>`).join("")}</div>
      <button class="mi" data-act="fform">Add a folder</button>
      <button class="mi" data-act="archive">Archive project</button>
      <button class="mi red" data-act="delproj" data-id="${p.id}">Delete project</button></div>`:"";
  return `<section class="panel cut ptop" style="--pc:${p.color}">
    <div class="phead">${gemSVG(p.color,f)}<input class="titleinput" id="ptitle" value="${esc(p.name)}" aria-label="Project name">
      <div class="pprog" title="${p.tasks.filter(t=>t.done).length} of ${p.tasks.length} tasks done"><span class="bar"><i style="width:${f*100}%"></i></span>${Math.round(f*100)}%</div>
      <button class="menubtn cut" data-act="menu" aria-label="Project options" aria-expanded="${menuOpen}">⋯</button></div>
    ${pop}
    <div class="fchips">${chipsHTML(p,folderForm,0)}${folderForm?"":`<button class="fadd" data-act="fform">+ Folder</button>`}</div>
    ${folderForm?`<div class="fform"><input class="field" id="flabel" placeholder="Name, e.g. Drawings" aria-label="Folder name"><input class="field path" id="fpath" placeholder="Paste the folder path" aria-label="Folder path"><button class="go cut" data-act="addfolder">Save</button><button class="ghost cut" data-act="fform">Done</button></div>`:""}
  </section>
  <section class="panel cut" style="--pc:${p.color}">
    <div class="addbar"><input class="field" id="newtask" placeholder="Add a task" aria-label="New task"><button class="go cut" data-act="addtask">Add</button></div>
    ${openT.length?list(wrap(openT),{ctx:"project",sort:true,pid:p.id}):`<div class="empty">${p.tasks.length?(waitT.length?"Nothing to do right now. The rest is waiting on others.":"All done. Nice work."):"No tasks yet. Add your first one above."}</div>`}

function autoGrow(el){if(!el)return;el.style.height="auto";el.style.height=el.scrollHeight+"px";}

/* ---------- actions ---------- */
function toast(msg,gold){
  const t=$("toast");t.textContent=msg;t.className="toast cut show"+(gold?" gold":"");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.className="toast cut",1900);
}
function burst(el,color,amt){
  amt=amt||XP_PER;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!el.getBoundingClientRect) return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  for(let i=0;i<10;i++){
    const s=document.createElement("div");s.className="shard";s.style.background=i%3?color:"var(--gold)";
    s.style.left=cx+"px";s.style.top=cy+"px";document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,d=30+Math.random()*40;

      {duration:550+Math.random()*250,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>s.remove();
  }

async function copyText(txt){

function toggleTask(p,t,el){

  t.done=!t.done;
  if(t.done){t.doneAt=Date.now();state.xp+=XP_PER;state.log[k]=(state.log[k]||0)+1;burst(el,p.color);}
  else{state.xp=Math.max(0,state.xp-XP_PER);if(state.log[k])state.log[k]--;}
  save();
  const it=el.closest(".titem");
  if(t.done&&it){it.classList.add("done");setTimeout(refreshAll,320);}else refreshAll();
  celebrate(before,t.done&&!p.tasks.some(x=>!x.done)?p.name+" cleared":null);

function toggleStep(p,t,sid,el){

function setProg(p,t,v,el){

function moveTask(p,t,dir){

  const i=peers.indexOf(t),j=i+dir;if(j<0||j>=peers.length) return;

  p.tasks[a]=peers[j];p.tasks[b]=t;save();refreshAll();
}

function openSearch(){$("search").classList.add("open");$("sq").value="";runSearch();setTimeout(()=>$("sq").focus(),10);}

function runSearch(){
  const q=$("sq").value.trim().toLowerCase(), has=s=>(s||"").toLowerCase().includes(q);
  const tasks=[],projs=[],folders=[];
  if(!q){active().forEach(p=>projs.push({k:"proj",p}));}
  else{
    state.projects.forEach(p=>{
      if(has(p.name)||has(p.notes)) projs.push({k:"proj",p});
      p.folders.forEach(f=>{if(has(f.label)||has(f.path)) folders.push({k:"folder",p,f});});
      p.tasks.forEach(t=>{if(has(t.text)||has(t.notes)||has(t.waitFor)||(t.subs||[]).some(s=>has(s.text))) tasks.push({k:"task",p,t});});
    });
    tasks.sort((a,b)=>(a.t.done?1:0)-(b.t.done?1:0));
  }
  sItems=[...tasks.slice(0,12),...projs.slice(0,8),...folders.slice(0,8)];sSel=0;
  let h="",i=0;
  const item=(inner,x)=>`<button class="sitem ${i===sSel?"sel":""}" data-i="${i++}" role="option" style="--pc:${x.p.color}">${inner}</button>`;
  const T=sItems.filter(x=>x.k==="task"),P=sItems.filter(x=>x.k==="proj"),F=sItems.filter(x=>x.k==="folder");
  if(T.length) h+=`<div class="sgrp">Tasks</div>`+T.map(x=>item(`${gemSVG(x.p.color,x.t.done?1:0)}<span class="s1 ${x.t.done?"done":""}">${esc(x.t.text)}</span><span class="s2">${esc(x.p.name)}${x.p.archived?" · archived":""}</span>`,x)).join("");
  if(P.length) h+=`<div class="sgrp">Projects</div>`+P.map(x=>item(`${gemSVG(x.p.color,projFrac(x.p))}<span class="s1">${esc(x.p.name)}</span><span class="s2">${x.p.archived?"archived":todoCount(x.p)+" to do"}</span>`,x)).join("");
  if(F.length) h+=`<div class="sgrp">Folders · Enter copies the path</div>`+F.map(x=>item(`<svg class="fi" viewBox="0 0 16 14" width="16" height="14" aria-hidden="true"><path fill="currentColor" d="M0 5h16v7.5L14.5 14H0z"/><path fill="currentColor" opacity=".45" d="M0 2.5 1.5 1h4.5l1.5 1.5H16V5H0z"/></svg><span class="s1">${esc(folderName(x.f))}</span><span class="s2">${esc(x.f.path)}</span>`,x)).join("");
  $("sres").innerHTML=h||`<div class="sempty">${q?"No matches.":"Create a project to get started."}</div>`;
}

let drag=null, justDragged=false;
document.addEventListener("pointerdown",e=>{
  const g=e.target.closest("[data-grip]");if(!g||e.button!==0) return;
  const item=g.closest(".titem,.navbtn"), listEl=item&&item.parentElement;
  if(!listEl||!listEl.dataset.sort) return;
  e.preventDefault();
  drag={item,list:listEl,y:e.clientY,moved:false};
  try{g.setPointerCapture(e.pointerId);}catch(err){}

document.addEventListener("pointermove",e=>{
  if(!drag) return;
  if(!drag.moved&&Math.abs(e.clientY-drag.y)<4) return;
  if(!drag.moved){drag.moved=true;drag.item.classList.add("dragging");document.body.classList.add("sorting");}
  const sibs=[...drag.list.children].filter(c=>c!==drag.item&&c.matches(".titem,.navbtn"));
  let before=null;
  for(const s of sibs){const r=s.getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=s;break;}}
  if(before!==drag.item.nextElementSibling||(!before&&drag.list.lastElementChild!==drag.item)) drag.list.insertBefore(drag.item,before);
});
function endDrag(commit){
  if(!drag) return;const d=drag;drag=null;
  document.body.classList.remove("sorting");d.item.classList.remove("dragging");
  if(!d.moved) return;
  justDragged=true;setTimeout(()=>{justDragged=false;},60);
  if(!commit){render();return;}
  const ids=[...d.list.children].map(c=>c.dataset.tid||c.dataset.sid).filter(Boolean);
  if(d.list.dataset.sort==="tasks"){
    const p=proj(d.list.dataset.pid);if(!p) return;

    p.tasks=ids.map(i=>m.get(i)).filter(Boolean).concat(p.tasks.filter(t=>!ids.includes(t.id)));
  } else {
    state.projects=ids.map(proj).filter(Boolean).concat(state.projects.filter(p=>!ids.includes(p.id)));
  }
  save();render();
}
document.addEventListener("pointerup",()=>endDrag(true));

/* ---------- week calendar ---------- */
const WK={start:6,end:22,ph:48};
let calScroll=null, cd=null, qadd=null;
const calSVG='<svg class="gem" viewBox="0 0 100 100" aria-hidden="true"><polygon points="10,22 90,22 90,84 80,94 10,94" fill="#4f86e8" fill-opacity=".85"/><polygon points="10,22 90,22 90,40 10,40" fill="#000" fill-opacity=".28"/><rect x="26" y="8" width="10" height="22" fill="#4f86e8"/><rect x="64" y="8" width="10" height="22" fill="#4f86e8"/><polygon points="26,52 40,52 40,64 26,64" fill="#fff" fill-opacity=".85"/><polygon points="46,52 60,52 60,64 46,64" fill="#fff" fill-opacity=".5"/><polygon points="66,52 80,52 80,64 66,64" fill="#fff" fill-opacity=".5"/><polygon points="26,70 40,70 40,82 26,82" fill="#fff" fill-opacity=".5"/></svg>';
const meetColor=()=>state.meetColor||"#6b8fb8";
function weekStart(iso){const d=iso?parseISO(iso):new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function calDays(){const s=weekStart(ui.calWeek);return Array.from({length:ui.calWeekend?7:5},(_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return d;});}
const slotDay=t=>t.slot?t.slot.s.slice(0,10):null;
const hm=s=>(+s.slice(11,13))*60+(+s.slice(14,16));
const mkSlot=(day,min)=>day+"T"+pad(Math.floor(min/60))+":"+pad(min%60);
const fmtLocal=d=>isoOf(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
function fmtTime(min){const h=Math.floor(min/60)%24,m=min%60;return (((h+11)%12)+1)+(m?":"+pad(m):"")+(h<12?"am":"pm");}
function fmtSlot(sl){
  const d=parseISO(sl.s.slice(0,10)),a=hm(sl.s);
  return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})+", "+fmtTime(a)+"–"+fmtTime(a+sl.m);
}
function slotMeta(t){
  if(!t.slot) return "";
  const day=slotDay(t),n=daysUntil(day),a=hm(t.slot.s);
  const lbl=n===0?fmtTime(a):(n>0&&n<7?parseISO(day).toLocaleDateString(undefined,{weekday:"short"})+" ":parseISO(day).toLocaleDateString(undefined,{day:"numeric",month:"short"})+" ")+(n===0?"":fmtTime(a));
  return `<span class="meta ${n===0?"today":""}" title="On the calendar: ${esc(fmtSlot(t.slot))}">▣ ${lbl}</span>`;
}
function layoutDay(evs){
  evs.sort((a,b)=>a.s-b.s||b.e-a.e);
  let group=[],cols=[],gEnd=-1;
  const flush=()=>{group.forEach(x=>x.cols=cols.length);group=[];cols=[];};
  for(const ev of evs){
    if(group.length&&ev.s>=gEnd){flush();gEnd=-1;}
    let c=cols.findIndex(end=>end<=ev.s);
    if(c<0){c=cols.length;cols.push(ev.e);}else cols[c]=ev.e;
    ev.col=c;group.push(ev);gEnd=Math.max(gEnd,ev.e);
  }
  flush();return evs;
}
function weekHTML(){
  if(!active().length) return heroHTML();
  const days=calDays(),dIso=days.map(isoOf),t0=todayISO(),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  const first=days[0],last=days[days.length-1];

function endCal(commit){
  if(!cd) return;const c=cd;cd=null;

  if(c.chip) c.chip.remove();
  if(c.mode==="tap"){if(commit) openQaddAt(c.col,minAt(c.col,c.y),60);return;}
  if(!c.moved){
    if(c.mode==="create"&&commit) openQaddAt(c.col,c.a,60);
    return;
  }
  justDragged=true;setTimeout(()=>{justDragged=false;},60);
  if(!commit){if(c.prev)c.prev.remove();if(c.sel)c.sel.remove();renderMain();return;}
  const t=c.f&&c.f.t;
  if(c.mode==="resize"){t.slot.m=c.m;save();refreshAll();return;}
  if(c.mode==="move"){
    if(c.overTray){delete t.slot;save();refreshAll();toast("Moved back to To schedule");return;}
    if(c.day){t.slot.s=mkSlot(c.day,c.min);save();}
    refreshAll();return;
  }
  if(c.mode==="place"){
    if(c.prev) c.prev.remove();
    if(c.day){t.slot={s:mkSlot(c.day,c.min),m:(t.slot&&t.slot.m)||60};save();refreshAll();toast("Scheduled "+fmtSlot(t.slot));}
    return;
  }

}

/* meetings from an Outlook calendar file (.ics) */
function icsUnesc(s){return (s||"").replace(/\\n/gi," ").replace(/\\([,;\\])/g,"$1").trim();}
function parseICS(text){
  const lines=text.replace(/\r?\n[ \t]/g,"").split(/\r?\n/);
  const evs=[];let cur=null,depth=0;
  for(const line of lines){
    if(line==="BEGIN:VEVENT"){cur={};depth=0;continue;}
    if(line==="END:VEVENT"){if(cur)evs.push(cur);cur=null;continue;}
    if(!cur) continue;
    if(line.startsWith("BEGIN:")){depth++;continue;}
    if(line.startsWith("END:")){depth--;continue;}
    if(depth>0) continue;
    const i=line.indexOf(":");if(i<0) continue;
    const parts=line.slice(0,i).split(";"),name=parts[0].toUpperCase(),val=line.slice(i+1),P={};
    parts.slice(1).forEach(p=>{const j=p.indexOf("=");if(j>0)P[p.slice(0,j).toUpperCase()]=p.slice(j+1).replace(/^"|"$/g,"");});
    if(name==="EXDATE") (cur.EXDATE=cur.EXDATE||[]).push(...val.split(",").map(v=>({v,P})));
    else if(!cur[name]) cur[name]={v:val,P};

}
function icsDate(o){

      for(const d of c){if(!emit(d)) break outer;}
    }
  } else if(R.FREQ==="YEARLY"){
    for(let k=0;guard++<30;k+=iv){const d=new Date(st.d.getFullYear()+k,st.d.getMonth(),st.d.getDate(),H,Mi);if(!emit(d)) break;}
  } else take(st.d);
  return {starts:out,dur,allDay:st.allDay};
}
function importICS(text){
  const evs=parseICS(text);
  if(!evs.length){toast("No meetings found in that file");return;}
  const from=new Date();from.setDate(from.getDate()-60);from.setHours(0,0,0,0);
  const to=new Date();to.setDate(to.getDate()+240);
  const ov={};
  evs.forEach(ev=>{if(ev["RECURRENCE-ID"]&&ev.UID){(ov[ev.UID.v]=ov[ev.UID.v]||[]).push(icsDate(ev["RECURRENCE-ID"]).d.getTime());}});
  const out=[];
  evs.forEach(ev=>{
    if(!ev.DTSTART) return;
    const title=icsUnesc(ev.SUMMARY&&ev.SUMMARY.v)||"Busy";
    if((ev.STATUS&&/CANCELLED/i.test(ev.STATUS.v))||/^(canceled|cancelled):/i.test(title)) return;
    const r=expandEvent(ev,from,to,ev["RECURRENCE-ID"]?null:(ev.UID&&ov[ev.UID.v]));
    const loc=icsUnesc(ev.LOCATION&&ev.LOCATION.v);
    r.starts.forEach(s=>{const e=new Date(s.getTime()+(r.allDay?Math.max(r.dur,864e5):r.dur));out.push({t:title,l:loc,s:fmtLocal(s),e:fmtLocal(e),a:r.allDay});});
  });
  out.sort((a,b)=>a.s<b.s?-1:1);
  state.meetings=out.slice(0,4000);state.meetingsAt=Date.now();save();
  closeMeet();renderMain();renderSide();
  toast(out.length?`Added ${out.length} meetings`:"No upcoming meetings in that file",true);
}
function readICSFile(file){
  if(!file) return;
  if(!/\.ics$/i.test(file.name)&&file.type!=="text/calendar"){toast("That isn’t a calendar (.ics) file");return;}
  const r=new FileReader();r.onload=()=>{try{importICS(String(r.result));}catch(err){toast("Couldn’t read that calendar file");}};r.readAsText(file);
}

/* ---------- GitHub sync (used on the GitHub Pages copy) ---------- */
function setSync(label,cls){
  syncLabel=label;
  const el=document.querySelector(".sync");if(el)el.textContent=label;
  const b=document.getElementById("syncBtn");b.classList.remove("synced","warn");if(cls)b.classList.add(cls);
  renderUser(label);
}
function renderUser(label){
  const b=document.getElementById("syncBtn");
  if(GH.tok){
    const n=GH.user||"Signed in";
    b.classList.remove("out");
    b.innerHTML=`<span class="av" aria-hidden="true">${esc(n.charAt(0).toUpperCase())}</span><span class="un">${esc(n)}</span><span class="dot" aria-hidden="true"></span>`;
    b.title=n+" · "+(label||syncLabel);b.setAttribute("aria-label","Account: "+n+". "+(label||syncLabel));
  } else {
    b.classList.add("out");b.classList.remove("synced","warn");
    b.textContent="Sign in";b.title="Sign in to sync across computers";b.setAttribute("aria-label","Sign in");
  }
}
async function gh(path,opt){
  opt=opt||{};
  const r=await fetch("https://api.github.com"+path,Object.assign({},opt,{cache:"no-store",headers:Object.assign(
    {"Authorization":"Bearer "+GH.tok,"Accept":"application/vnd.github+json"},opt.body?{"Content-Type":"application/json"}:{})}));
  if(!r.ok){const e=new Error("GitHub "+r.status);e.status=r.status;throw e;}
  return r.json();
}
async function gistFind(){
  if(GH.id) return GH.id;
  for(let page=1;page<=10;page++){
    const list=await gh("/gists?per_page=100&page="+page);
    const g=list.find(x=>x.files&&x.files[GFILE]);
    if(g){GH.id=g.id;break;}
    if(list.length<100) break;
  }
  if(!GH.id){
    const g=await gh("/gists",{method:"POST",body:JSON.stringify({description:"Quest Log data (synced by the app, keep this)",public:false,
      files:{[GFILE]:{content:JSON.stringify(state)}}})});
    GH.id=g.id;
  }
  try{localStorage.setItem("questlog.gistid",GH.id);}catch(e){}
  return GH.id;
}
let pushTimer=null,lastPull=0,pulling=false;
function gistPushSoon(){clearTimeout(pushTimer);setSync("Syncing…");pushTimer=setTimeout(gistPush,1500);}
async function gistPush(){
  pushTimer=null;
  if(!GH.tok||!GH.id) return;
  try{await gh("/gists/"+GH.id,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(state)}}})});
    setSync("Synced to GitHub · "+GH.user,"synced");}
  catch(e){setSync(e.status===401?"Sync key expired. Click ☁ to reconnect":"Couldn’t sync. Saved on this device","warn");}
}
async function gistPull(){
  if(!GH.tok||pulling) return; pulling=true;
  try{
    const id=await gistFind();
    const g=await gh("/gists/"+id);
    const f=g.files&&g.files[GFILE];
    if(!f){GH.id=null;try{localStorage.removeItem("questlog.gistid");}catch(e){} pulling=false;return gistPull();}
    let txt=f.content; if(f.truncated) txt=await (await fetch(f.raw_url,{cache:"no-store"})).text();
    let remote={};try{remote=JSON.parse(txt||"{}");}catch(e){}
    if((remote.updatedAt||0)>(state.updatedAt||0)){
      const view=state.view;
      state=normalize(Object.assign(blank(),remote));
      if(view==="all"||view==="today"||proj(view)) state.view=view;
      try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
      if(!editing) render();
    } else if((remote.updatedAt||0)<(state.updatedAt||0)) await gistPush();
    setSync("Synced to GitHub · "+GH.user,"synced");
    lastPull=Date.now();
  }catch(e){
    setSync(e.status===401?"Sync key expired. Click ☁ to reconnect":"Couldn’t reach GitHub. Saved on this device","warn");
  }
  pulling=false;
}
const TOKEN_URL="https://github.com/settings/tokens/new?scopes=gist&description=Quest%20Log%20sync";
const DEFAULT_USER="ArleneSchmidt", LOGIN_FILE="questlog-login.json", ITER=600000;
const b64=u=>{let t="";u.forEach(x=>t+=String.fromCharCode(x));return btoa(t);};
const unb64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function pwKey(pw,salt,iter){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function setPassword(){
  const p1=document.getElementById("pw1").value, p2=document.getElementById("pw2").value, err=document.getElementById("pwErr");
  if(p1.length<4){err.textContent="Use at least 4 characters.";return;}
  if(p1!==p2){err.textContent="The passwords don’t match.";return;}
  err.textContent="Saving…";
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
    const key=await pwKey(p1,salt,ITER);
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(GH.tok)));
    const content=JSON.stringify({v:1,iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct)});
    let existing=null;
    for(let page=1;page<=10&&!existing;page++){
      const list=await gh("/gists?per_page=100&page="+page);
      existing=list.find(x=>x.files&&x.files[LOGIN_FILE]);
      if(list.length<100) break;
    }
    if(existing) await gh("/gists/"+existing.id,{method:"PATCH",body:JSON.stringify({files:{[LOGIN_FILE]:{content}}})});
    else await gh("/gists",{method:"POST",body:JSON.stringify({description:"Quest Log sign-in (encrypted, keep this)",public:true,files:{[LOGIN_FILE]:{content}}})});
    try{localStorage.setItem("questlog.haspw","1");}catch(e){}
    closeSync();toast("Password set. Sign in on any computer with it",true);
  }catch(e){err.textContent="Couldn’t save the password. Try again.";}
}
async function pwSignIn(){
  const u=(document.getElementById("uIn").value||"").trim(), pw=document.getElementById("pwIn").value, err=document.getElementById("tokErr");
  if(!u||!pw){err.textContent="Enter your username and password.";return;}
  err.textContent="Signing in…";
  try{
    const r=await fetch("https://api.github.com/users/"+encodeURIComponent(u)+"/gists?per_page=100",{cache:"no-store"});
    if(!r.ok) throw Object.assign(new Error(),{kind:r.status===404?"user":"net"});
    const g=(await r.json()).find(x=>x.files&&x.files[LOGIN_FILE]);
    if(!g) throw Object.assign(new Error(),{kind:"nopw"});
    const full=await (await fetch("https://api.github.com/gists/"+g.id,{cache:"no-store"})).json();
    const d=JSON.parse(full.files[LOGIN_FILE].content);
    let tok;
    try{
      const key=await pwKey(pw,unb64(d.salt),d.iter);
      tok=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(d.iv)},key,unb64(d.ct)));
    }catch(e){throw Object.assign(new Error(),{kind:"pw"});}
    document.getElementById("tokIn").value=tok;
    await connect();
  }catch(e){
    err.textContent=e.kind==="pw"?"Wrong password.":e.kind==="user"?"No GitHub user with that name.":e.kind==="nopw"?"No password set yet. Sign in with your sync key below, then set one.":"Couldn’t reach GitHub. Try again.";
  }
}
function openSync(){
  const box=document.getElementById("syncBox");
  if(GH.tok){
    box.innerHTML=`<h3 id="syncTitle">Signed in</h3>
      <div class="who">${esc(GH.user||"GitHub user")}</div>
      <p>Your tasks are saved to your GitHub account and load on any computer where you sign in.</p>
      <h3 style="font-size:17px;margin-top:6px">${localStorage.getItem("questlog.haspw")?"Change your password":"Set a password for other computers"}</h3>
      <p>Then on any other computer you just sign in with your username and this password. No key needed.</p>
      <input class="field" id="pw1" type="password" placeholder="New password" aria-label="New password" autocomplete="new-password">
      <input class="field" id="pw2" type="password" placeholder="Type it again" aria-label="Confirm password" autocomplete="new-password">
      <div class="merr" id="pwErr"></div>
      <div class="mrow"><button class="ghost cut" data-m="signout">Sign out on this computer</button>
      <button class="ghost cut" data-m="close">Close</button><button class="go cut" data-m="setpw">Save password</button></div>`;
  } else {
    box.innerHTML=`<h3 id="syncTitle">Sign in to Quest Log</h3>
      <p>Sign in to load your tasks and keep them synced on every computer.</p>
      <form id="pwForm" onsubmit="return false">
      <input class="field" id="uIn" value="${DEFAULT_USER}" placeholder="GitHub username" aria-label="Username" autocomplete="username" spellcheck="false" style="font-family:inherit;font-size:16px">
      <input class="field" id="pwIn" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password" style="font-family:inherit;font-size:16px">
      </form>
      <div class="merr" id="tokErr"></div>
      <div class="mrow" style="margin-bottom:18px"><button class="ghost cut" data-m="skip">Continue without signing in</button><button class="go cut" data-m="pwsignin">Sign in</button></div>
      <details><summary style="cursor:pointer;color:var(--muted);font-size:14px">First time, or no password yet? Use a sync key</summary>
      <ol style="margin-top:10px">
        <li><a href="${TOKEN_URL}" target="_blank" rel="noopener">Open the sync key page on GitHub</a> (everything is pre-filled).</li>
        <li>Set <b>Expiration</b> to <b>No expiration</b>, then click <b>Generate token</b>.</li>
        <li>Paste the key (starts with <b>ghp_</b>) below.</li>
      </ol>
      <input class="field" id="tokIn" placeholder="ghp_…" aria-label="GitHub sync key" autocomplete="off" spellcheck="false">
      <div class="mrow"><button class="go cut" data-m="connect">Sign in with key</button></div></details>`;
  }
  document.getElementById("syncModal").classList.add("open");
  const f=document.getElementById("pwIn")||document.getElementById("pw1");if(f)f.focus();
}
function closeSync(){document.getElementById("syncModal").classList.remove("open");}
async function connect(){
  const v=(document.getElementById("tokIn").value||"").trim(), err=document.getElementById("tokErr");
  if(!v){err.textContent="Paste your sync key first.";return;}
  err.textContent="Checking…";
  GH.tok=v;
  try{
    const u=await gh("/user");
    GH.user=u.login;
    try{localStorage.setItem("questlog.ghtoken",v);localStorage.setItem("questlog.ghuser",u.login);}catch(e){}
    GH.id=null; try{localStorage.removeItem("questlog.gistid");}catch(e){}
    await gistPull();
    if(!GH.id) throw Object.assign(new Error("no gist"),{status:403});
    closeSync(); toast("Signed in. Your tasks will sync",true);
  }catch(e){
    GH.tok=null;GH.user=null;
    err.textContent=e.status===401?"That key didn’t work. Check you copied all of it.":e.status===403||e.status===404?"That key doesn’t have the gist permission. Use the link in step 1.":"Couldn’t reach GitHub. Check your connection and try again.";
  }
}
function signOut(){
  GH.tok=GH.id=GH.user=null;
  try{["questlog.ghtoken","questlog.gistid","questlog.ghuser"].forEach(k=>localStorage.removeItem(k));}catch(e){}
  setSync("Saved on this device");closeSync();toast("Signed out on this computer");
}
document.getElementById("syncBtn").addEventListener("click",openSync);
document.getElementById("syncModal").addEventListener("click",e=>{
  if(e.target.id==="syncModal") return closeSync();
  const m=e.target.closest("[data-m]");if(!m) return;
  ({close:closeSync,connect:connect,signout:signOut,setpw:setPassword,pwsignin:pwSignIn,
    skip:()=>{try{localStorage.setItem("questlog.skipsignin","1");}catch(e){}closeSync();}})[m.dataset.m]();
});
document.getElementById("syncModal").addEventListener("keydown",e=>{
  if(e.key==="Escape") closeSync();
  if(e.key==="Enter"&&e.target.id==="tokIn"){e.preventDefault();connect();}
  if(e.key==="Enter"&&(e.target.id==="pwIn"||e.target.id==="uIn")){e.preventDefault();pwSignIn();}
  if(e.key==="Enter"&&(e.target.id==="pw1"||e.target.id==="pw2")){e.preventDefault();setPassword();}
});
const inClaude=!!(window.claude&&window.claude.use);
if(!inClaude){
  document.getElementById("syncBtn").hidden=false;
  renderUser();
  if(GH.tok){setSync("Connecting to GitHub…");gistPull();}
  else{let skip=false;try{skip=!!localStorage.getItem("questlog.skipsignin");}catch(e){} if(!skip) openSync();}
  const maybePull=()=>{if(GH.tok&&document.visibilityState==="visible"&&Date.now()-lastPull>15000&&!pushTimer) gistPull();};
  document.addEventListener("visibilitychange",maybePull);
  window.addEventListener("focus",maybePull);
  setInterval(maybePull,60000);
}

drawFacets();render();
